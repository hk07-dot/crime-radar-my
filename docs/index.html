<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crime Radar MY</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Narrow:wght@600&display=swap">
<style>
/* Modernist, from the Nightwatch design: Archivo on an off-white ground, near-black ink, one red accent,
   zero radius, strong 2px rules, flush-left labels, small uppercase Archivo Narrow captions.
   Layout: full-bleed map in soft colour; a bottom sheet on phones that becomes a left panel on wide screens.
   One light theme by design: the map tiles and the red ramp are built for a light ground. */
:root {
  color-scheme: light;
  --bg: #f3f2f2; --surface: #eae9e9; --fg: #201e1d;
  --muted: #605d5d;            /* neutral-700: 6:1 on the ground, safe for small text */
  --line: #a19f9e;             /* the system's divider: 40% ink on the ground */
  --rule: #201e1d;             /* strong 2px rules */
  --accent: #ec3013; --accent-600: #dd2b0f; --accent-700: #ae1800; --accent-100: #fff2ef; --accent-200: #ffe0d9;
  --n300: #d7d3d3; --n400: #bab6b6;
  /* Crime density ramp: the accent ramp, light to deep. */
  --heat-1: #ffc4b8; --heat-2: #ff9783; --heat-3: #ec3013; --heat-4: #ae1800;
  --route: #201e1d;            /* route stretches with low crime density */
  --ring: #ec3013;             /* 10 km ring and your marker */
  --official: #201e1d; --news: #201e1d; --social: #201e1d;
  --shadow: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
  --sans: "Archivo", system-ui, sans-serif; --narrow: "Archivo Narrow", "Archivo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--sans); display: grid; grid-template-rows: 1fr auto; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
a { color: var(--accent-700); text-decoration: none; } a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
#map { min-height: 0; }
.sheet { background: var(--bg); border-top: 2px solid var(--rule); max-height: 50vh; overflow-y: auto;
  padding: 14px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; overflow-x: hidden; }
.sheet > * { min-width: 0; }
@media (min-width: 860px) {
  body { grid-template-columns: 400px 1fr; grid-template-rows: 1fr; }
  .sheet { grid-column: 1; grid-row: 1; max-height: none; border-top: 0; border-right: 2px solid var(--rule); padding-top: 20px; }
  #map { grid-column: 2; grid-row: 1; }
}

/* Type */
.kicker, .label, .mono { font-family: var(--narrow); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.kicker { font-size: 11px; color: var(--accent-700); margin: 0; }
h1 { font: 800 26px/1.05 var(--sans); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.label { font-size: 10px; color: var(--muted); margin: 0 0 8px; }
.note { color: var(--muted); font-size: 12.5px; margin: 0; }
.empty { color: var(--muted); cursor: default; }
header { padding-bottom: 14px; border-bottom: 2px solid var(--rule); }

/* Buttons: flush-left labels, square corners */
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
button { font: 800 14px/1.2 var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 0;
  padding: 9px 13px; cursor: pointer; text-align: left; }
button:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
button:active { background: color-mix(in srgb, var(--fg) 14%, transparent); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button.primary:hover { background: var(--accent-600); } button.primary:active { background: var(--accent-700); }

/* Segmented controls (date range, travel mode) */
.seg { display: flex; border: 2px solid var(--rule); }
.seg label { flex: 1; position: relative; padding: 9px 10px; font: 700 13px/1.2 var(--sans); cursor: pointer; white-space: nowrap; }
.seg label + label { border-left: 2px solid var(--rule); }
.seg input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--bg); }
.seg label:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -4px; }
.seg.grow { flex: 1; }
/* Four options don't fit one row on a phone: show them as a 2 x 2 grid. */
@media (max-width: 720px) {
  .seg.four { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg.four label + label { border-left: 0; }
  .seg.four label:nth-child(even) { border-left: 2px solid var(--rule); }
  .seg.four label:nth-child(n+3) { border-top: 2px solid var(--rule); }
}

/* Layer toggles */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--rule); padding: 7px 10px;
  font: 700 12.5px/1.2 var(--sans); cursor: pointer; user-select: none; }
.chip input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.chip:has(input:checked) { background: var(--fg); color: var(--bg); }
.chip:has(input:checked) .dot { box-shadow: 0 0 0 1.5px var(--bg); }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 10px; height: 10px; display: inline-block; flex: none; }
.dot.official { border: 1.5px solid currentColor; border-radius: 50%; }
.dot.news { background: currentColor; }
.dot.social { border: 1.5px dashed currentColor; }
.dot.heat { background: linear-gradient(90deg, var(--heat-1), var(--heat-4)); }

/* Density here + key numbers */
.area { display: flex; gap: 10px; align-items: center; border: 2px solid var(--rule); padding: 10px 12px; }
.area .sw { width: 14px; height: 14px; flex: none; border: 1px solid var(--rule); }
.area b { font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--rule); }
.stat { padding: 10px 11px; min-width: 0; }
.stat + .stat { border-left: 2px solid var(--rule); }
.stat b { display: block; font: 800 28px/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 6px; font: 600 10px/1.3 var(--narrow); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Lists: rows on 1px rules, a square swatch, bold title, narrow caps meta */
ul { list-style: none; margin: 0; padding: 0; display: block; }
#list, #districts, .warns { border-top: 2px solid var(--rule); }
#list li, #districts li, .warns li { display: grid; grid-template-columns: 18px minmax(0, 1fr); overflow-wrap: anywhere; column-gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--line); cursor: pointer; }
#list li::before, #districts li::before, .warns li::before { content: ""; width: 14px; height: 14px; margin-top: 3px; grid-row: span 3; }
li.news::before { background: var(--fg); }
li.social::before { border: 1.5px dashed var(--fg); }
li.official::before { border: 1.5px solid var(--fg); border-radius: 50%; }
.warns li::before { background: var(--accent); }
.warns li.social::before { background: none; border: 1.5px dashed var(--accent); }
#list li.empty::before, #districts li.empty::before { display: none; }
#list li.empty, #districts li.empty { display: block; }
li .t, .warns .road { font: 700 14.5px/1.3 var(--sans); letter-spacing: -.01em; }
li .m { color: var(--muted); font: 600 10.5px/1.4 var(--narrow); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; font-variant-numeric: tabular-nums; }
.warns .m:first-of-type { text-transform: none; letter-spacing: 0; font: 400 13px/1.4 var(--sans); }
li .m.src { color: var(--accent-700); }
#list li:hover, #districts li:hover, .warns li:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.tag { font: 600 9.5px/1 var(--narrow); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; margin-left: 6px; vertical-align: 2px; }
.tag.unverified { border: 1px solid var(--fg); color: var(--fg); }
.tag.approx { background: var(--surface); color: var(--muted); }

/* Legend */
.legend { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.legend div { display: flex; gap: 10px; align-items: flex-start; }
.legend i { width: 22px; height: 12px; flex: none; border: 1px solid var(--rule); margin-top: 3px; }
.legend b { color: var(--fg); font-weight: 700; }

/* Route check */
.route { border: 2px solid var(--rule); }
.route summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; padding: 11px 12px;
  font: 800 16px/1.2 var(--sans); letter-spacing: -.01em; }
.route summary::-webkit-details-marker { display: none; }
.route summary::after { content: "+"; font-weight: 800; font-size: 20px; line-height: 1; }
.route[open] summary { border-bottom: 2px solid var(--rule); }
.route[open] summary::after { content: "\2013"; }
.route-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px; }
.route-body > *, .route-out > * { min-width: 0; }
.trip { border: 2px solid var(--rule); }
.field { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 8px 10px; }
.field + .field { border-top: 2px solid var(--rule); }
.field label { font: 600 10px/1.3 var(--narrow); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field .in { display: flex; gap: 6px; align-items: center; }
.field input { flex: 1; min-width: 0; font: 700 15px/1.3 var(--sans); color: var(--fg); background: transparent; border: 0; padding: 4px 0; caret-color: var(--accent); }
.field input::placeholder { color: var(--muted); font-weight: 400; }
.field:focus-within { background: var(--surface); }
.field .here { padding: 5px 8px; font: 600 10px/1.2 var(--narrow); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; border-color: var(--rule); }
.field ul, .search ul { background: var(--bg); border: 2px solid var(--rule); box-shadow: var(--shadow); max-height: 240px; overflow-y: auto; }
.field ul { position: absolute; left: -2px; right: -2px; top: 100%; z-index: 1000; }
.field li, .search li { padding: 9px 12px; cursor: pointer; display: block; border-bottom: 1px solid var(--line); }
.field li:last-child, .search li:last-child { border-bottom: 0; }
.field li[aria-selected="true"], .field li:hover, .search li[aria-selected="true"], .search li:hover { background: var(--accent-200); }
.field li b, .search li b { font-weight: 700; display: block; }
.field li span, .search li span { color: var(--muted); font: 600 10px/1.4 var(--narrow); letter-spacing: .08em; text-transform: uppercase; }
.field .msg, .search .msg { color: var(--muted); font-size: 13px; cursor: default; }
.route-out { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.route-sum { font: 800 22px/1.1 var(--sans); letter-spacing: -.02em; }
.route-sum span { display: block; margin-top: 4px; color: var(--muted); font: 600 10.5px/1.3 var(--narrow); letter-spacing: .08em; text-transform: uppercase; }
.strip { display: flex; gap: 2px; height: 12px; }
.strip i { display: block; height: 100%; border: 1px solid var(--n400); min-width: 3px; }

/* Map chrome */
.search { width: min(340px, calc(100vw - 80px)); background: var(--bg); color: var(--fg); border: 2px solid var(--rule); font: 14px/1.4 var(--sans); }
.search form { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; }
.search svg { flex: none; color: var(--fg); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 700 14px/1.3 var(--sans); padding: 7px 0; caret-color: var(--accent); }
.search input::placeholder { color: var(--muted); font-weight: 400; }
.search button { border: 0; padding: 4px 6px; font-size: 18px; line-height: 1; }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.search ul { border-width: 2px 0 0; box-shadow: none; }
.map-legend { background: var(--bg); color: var(--fg); border: 2px solid var(--rule); padding: 9px 10px; }
.map-legend b { display: block; font: 600 9px/1.2 var(--narrow); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.map-legend .cells { display: flex; gap: 2px; }
.map-legend .cells i { display: block; width: 28px; height: 12px; border: 1px solid var(--rule); }
.map-legend .ends { display: flex; justify-content: space-between; margin-top: 4px; font: 600 8.5px/1.1 var(--narrow); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.leaflet-heat-pane img { image-rendering: auto; }
.map-tiles { filter: saturate(.85) brightness(1.03); }
.leaflet-container { background: var(--surface); font-family: var(--sans); }
.leaflet-bar, .leaflet-touch .leaflet-bar { border: 2px solid var(--rule) !important; border-radius: 0 !important; box-shadow: none !important; }
.leaflet-bar a, .leaflet-bar a:hover { border-radius: 0 !important; background: var(--bg); color: var(--fg); font-weight: 800; border-bottom-color: var(--rule); }
.leaflet-bar a:hover { background: var(--accent-200); }
.leaflet-popup-content-wrapper { border-radius: 0; border: 2px solid var(--rule); background: var(--bg); color: var(--fg); box-shadow: var(--shadow); }
.leaflet-popup-tip { background: var(--bg); border: 2px solid var(--rule); box-shadow: none; }
.leaflet-popup-content { font: 13px/1.45 var(--sans); margin: 12px 14px; }
.leaflet-popup-content b { font-weight: 800; }
.leaflet-tooltip { border-radius: 0; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); box-shadow: none; font: 600 12px/1.3 var(--sans); }
.leaflet-control-attribution { font: 400 9px system-ui, sans-serif; background: rgba(243,242,242,.86) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--accent-700); }
/* Square pins: filled for news, dashed outline for unverified social posts, larger hollow for town-level */
.pin { box-sizing: border-box; cursor: pointer; }
.pin-news { background: var(--fg); box-shadow: 0 0 0 1.5px var(--bg); }
.pin-social { background: var(--bg); border: 1.5px dashed var(--fg); }
.pin-town { background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1.5px solid var(--fg); }
.pin-warn { border: 2.5px solid var(--accent); background: transparent; }
.pin-me { background: var(--ring); box-shadow: 0 0 0 2px var(--bg); }
.pin-end { background: var(--fg); box-shadow: 0 0 0 2px var(--bg); }
/* Dashboard: covers the map (the panel stays beside it on wide screens), the whole screen on phones. */
.dash { position: fixed; inset: 0; z-index: 2000; background: var(--bg); overflow-y: auto; overflow-x: hidden;
  padding: 18px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
@media (min-width: 860px) { .dash { left: 400px; padding: 22px 28px 32px; } }
.dash-in { max-width: 1120px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.dash-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding-bottom: 14px; border-bottom: 2px solid var(--rule); }
.dash-head h2 { font: 800 26px/1.05 var(--sans); letter-spacing: -.02em; margin: 6px 0 0; }
.dash-head button { flex: none; }
.dash-ctl { display: flex; flex-wrap: wrap; gap: 10px; }
.dash-ctl .seg { flex: 1 1 260px; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
@media (min-width: 1240px) { .dash-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
.dash-grid > * { min-width: 0; }
.rank { border-top: 2px solid var(--rule); }
.rank li { border-bottom: 1px solid var(--line); }
.rank button { width: 100%; border: 0; padding: 10px 8px 10px 0; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 6px; align-items: baseline; font-weight: 400; }
.rank button[aria-pressed="true"] { background: var(--accent-100); box-shadow: inset 4px 0 0 var(--accent); }
.rank .n { font: 800 22px/1 var(--sans); letter-spacing: -.03em; text-align: right; font-variant-numeric: tabular-nums; }
.rank .nm { font: 700 14.5px/1.25 var(--sans); overflow-wrap: anywhere; }
.rank .nm small { display: block; margin-top: 2px; color: var(--muted); font: 600 10px/1.3 var(--narrow); letter-spacing: .08em; text-transform: uppercase; }
.rank .v { text-align: right; font: 800 16px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.rank .v small { display: block; margin-top: 2px; font: 600 10px/1.3 var(--narrow); letter-spacing: .06em; color: var(--muted); }
.rank .bar { grid-column: 2 / 4; height: 8px; background: var(--n300); }
.rank .bar i { display: block; height: 100%; background: var(--fg); }
.rank button[aria-pressed="true"] .bar i { background: var(--accent); }
.up { color: var(--accent-700) !important; } .down { color: var(--muted); }
.detail { border: 2px solid var(--rule); padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.stat.old b { color: var(--muted); }
.police { border-top: 2px solid var(--rule); padding-top: 12px; }
.detail h3 { font: 800 22px/1.1 var(--sans); letter-spacing: -.02em; margin: 4px 0 0; overflow-wrap: anywhere; }
.bars li { border-bottom: 1px solid var(--line); }
.bars .row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; padding: 7px 0; text-align: left; }
.bars button.row, .rank button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
.bars button.row:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
.bars button.row[aria-expanded="true"] { background: var(--accent-100); box-shadow: inset 4px 0 0 var(--accent); padding-left: 8px; }
.arr { display: inline-block; margin-left: 6px; color: var(--muted); font: 700 11px/1 var(--narrow); }
.refs { padding: 4px 0 12px 18px; }
.rank .refs { padding-left: 44px; }
.refs ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--accent); }
.refs li { padding: 7px 0 7px 12px; border-bottom: 1px dotted var(--line); }
.refs li:last-child { border-bottom: 0; }
.refs a { font: 700 13.5px/1.35 var(--sans); color: var(--fg); overflow-wrap: anywhere; }
.refs a:hover { color: var(--accent-700); }
.refs .m { margin-top: 3px; color: var(--muted); font: 600 10.5px/1.4 var(--narrow); letter-spacing: .06em; text-transform: uppercase; }
.refs .note { margin: 6px 0 0 14px; }
.bars { border-top: 2px solid var(--rule); }
.bars .k { font: 700 13.5px/1.3 var(--sans); }
.bars .k em { font-style: normal; color: var(--muted); font: 600 10px/1 var(--narrow); letter-spacing: .08em; margin-right: 6px; }
.bars .c { font: 800 14px/1.3 var(--sans); font-variant-numeric: tabular-nums; text-align: right; }
.bars .c small { color: var(--muted); font: 600 10px/1 var(--narrow); letter-spacing: .06em; margin-left: 6px; }
.bars .bar { grid-column: 1 / 3; height: 6px; background: var(--n300); }
.bars .bar i { display: block; height: 100%; background: var(--accent); }
.bars.ink .bar i { background: var(--fg); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* Language switch, top right of the panel header */
header { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.lang { flex: none; display: flex; border: 2px solid var(--rule); }
.lang label { position: relative; padding: 5px 8px; font: 600 10.5px/1.2 var(--narrow); letter-spacing: .1em; cursor: pointer; }
.lang label + label { border-left: 2px solid var(--rule); }
.lang input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.lang label:has(input:checked) { background: var(--fg); color: var(--bg); }
.lang label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Dashboard sections */
.dash-tabs { display: flex; flex-wrap: wrap; border: 2px solid var(--rule); }
.dash-tabs label { flex: 1 1 auto; position: relative; padding: 10px 12px; font: 800 14px/1.2 var(--sans); cursor: pointer; white-space: nowrap; }
.dash-tabs label + label { border-left: 2px solid var(--rule); }
.dash-tabs input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.dash-tabs label:has(input:checked) { background: var(--fg); color: var(--bg); }
.dash-tabs label:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.dash-tabs label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -4px; }
@media (max-width: 560px) { .dash-tabs label { flex: 1 1 50%; } .dash-tabs label:nth-child(3) { border-left: 0; } .dash-tabs label:nth-child(n+3) { border-top: 2px solid var(--rule); } }
.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.panel > * { min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
@media (min-width: 1100px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cols > * { min-width: 0; }
.latest { border-top: 2px solid var(--rule); }
.latest li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.latest a { font-weight: 700; color: var(--fg); }
.latest a:hover { color: var(--accent-700); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); border-top: 2px solid var(--rule); border-left: 2px solid var(--rule); }
.card { padding: 12px; border-right: 2px solid var(--rule); border-bottom: 2px solid var(--rule); min-width: 0; }
.card .label { margin: 0 0 8px; }
.card b { display: block; font: 800 26px/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.card small { display: block; margin-top: 6px; color: var(--muted); font: 600 10.5px/1.4 var(--narrow); letter-spacing: .06em; }
.sources { border-top: 2px solid var(--rule); padding-top: 12px; display: grid; gap: 6px; }
.sources p { margin: 0; }
</style>
</head>
<body>
<div id="map" role="application" data-t-aria="map_aria"></div>

<section class="sheet" aria-live="polite">
  <header>
    <div>
      <p class="kicker" id="window-label">Crime Radar MY</p>
      <h1 id="h1"></h1>
      <p class="sub" id="where"></p>
    </div>
    <div class="lang" role="radiogroup" aria-label="Language / Bahasa">
      <label><input type="radio" name="lang" value="en">EN</label>
      <label><input type="radio" name="lang" value="ms">BM</label>
    </div>
  </header>

  <div class="row">
    <button class="primary" id="locate" style="flex:1" data-t="use_loc"></button>
    <button id="dash-open" type="button" aria-controls="dash" aria-expanded="false" style="flex:1" data-t="dash_btn"></button>
  </div>
  <div>
    <p class="label" data-t="distance"></p>
    <div class="seg" role="radiogroup" data-t-aria="distance_aria">
      <label><input type="radio" name="km" value="2">2 km</label>
      <label><input type="radio" name="km" value="5">5 km</label>
      <label><input type="radio" name="km" value="10" checked>10 km</label>
    </div>
  </div>
  <div>
    <p class="label" data-t="range"></p>
    <div class="seg" role="radiogroup" data-t-aria="range_aria">
      <label><input type="radio" name="days" value="7"><span data-t="d7"></span></label>
      <label><input type="radio" name="days" value="30"><span data-t="d30"></span></label>
      <label><input type="radio" name="days" value="2m" checked><span data-t="d2m"></span></label>
    </div>
  </div>
  <p class="note" id="range"></p>
  <p class="note" data-t="hint"></p>

  <details class="route" id="route-box">
    <summary data-t="route"></summary>
    <div class="route-body">
    <div class="trip">
    <div class="field">
      <label for="r-from" data-t="from"></label>
      <div class="in"><input id="r-from" type="text" data-t-ph="from_ph" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="r-from-list">
        <button type="button" class="here" id="r-from-here" data-t="my_loc"></button></div>
      <ul id="r-from-list" role="listbox" hidden></ul>
    </div>
    <div class="field">
      <label for="r-to" data-t="to"></label>
      <div class="in"><input id="r-to" type="text" data-t-ph="to_ph" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="r-to-list"></div>
      <ul id="r-to-list" role="listbox" hidden></ul>
    </div>
    </div>
    <div class="seg" role="radiogroup" data-t-aria="mode_aria">
      <label><input type="radio" name="r-mode" value="car" checked><span data-t="drive"></span></label>
      <label><input type="radio" name="r-mode" value="foot"><span data-t="walk"></span></label>
      <label><input type="radio" name="r-mode" value="bike"><span data-t="cycle"></span></label>
    </div>
    <div class="row">
      <button class="primary" id="r-go" type="button" style="flex:1" data-t="check_route"></button>
      <button id="r-clear" type="button" hidden data-t="clear"></button>
    </div>
    <div class="route-out" id="r-out" hidden aria-live="polite"></div>
    </div>
  </details>

  <div class="chips" role="group" data-t-aria="layers_aria">
    <label class="chip"><input type="checkbox" id="f-official"><span class="dot official"></span><span data-t="l_official"></span></label>
    <label class="chip"><input type="checkbox" id="f-news" checked><span class="dot news"></span><span data-t="l_news"></span></label>
    <label class="chip"><input type="checkbox" id="f-social" checked><span class="dot social"></span><span data-t="l_social"></span></label>
    <label class="chip"><input type="checkbox" id="f-heat" checked><span class="dot heat"></span><span data-t="l_heat"></span></label>
  </div>

  <div class="area" id="area" hidden>
    <span class="sw" id="area-sw"></span>
    <span><span data-t="density_here"></span> <b id="area-l"></b></span>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-news">–</b><span data-t="news_reports"></span></div>
    <div class="stat"><b id="s-social">–</b><span data-t="social_posts"></span></div>
    <div class="stat old"><b id="s-official">–</b><span id="s-official-l"></span></div>
  </div>

  <div>
    <p class="label" data-t="recent"></p>
    <ul id="list"><li class="empty" data-t="loading"></li></ul>
  </div>

  <div>
    <p class="label" data-t="shading"></p>
    <div class="legend" id="legend"></div>
  </div>

  <div>
    <p class="label" data-t="nearby"></p>
    <ul id="districts"></ul>
  </div>

  <p class="note" data-t="footnote"></p>
</section>

<section class="dash" id="dash" hidden role="dialog" aria-labelledby="dash-h">
  <div class="dash-in">
    <div class="dash-head">
      <div>
        <p class="kicker" id="dash-k"></p>
        <h2 id="dash-h" data-t="dash_title"></h2>
      </div>
      <button type="button" id="dash-close" data-t="close"></button>
    </div>
    <div class="dash-tabs" role="radiogroup" data-t-aria="tabs_aria">
      <label><input type="radio" name="d-tab" value="news" checked><span data-t="tab_news"></span></label>
      <label><input type="radio" name="d-tab" value="areas"><span data-t="tab_areas"></span></label>
      <label><input type="radio" name="d-tab" value="states"><span data-t="tab_states"></span></label>
      <label><input type="radio" name="d-tab" value="dosm"><span data-t="tab_dosm"></span></label>
    </div>
    <div class="dash-ctl" id="d-ctl">
      <div class="seg" role="radiogroup" data-t-aria="scope_aria" id="d-scope-seg">
        <label><input type="radio" name="d-scope" value="my" checked>Malaysia</label>
        <label><input type="radio" name="d-scope" value="state"><span id="d-state"></span></label>
      </div>
      <div class="seg four" role="radiogroup" data-t-aria="measure_aria">
        <label><input type="radio" name="d-measure" value="news" checked><span data-t="m_news"></span></label>
        <label><input type="radio" name="d-measure" value="total"><span data-t="m_total"></span></label>
        <label><input type="radio" name="d-measure" value="assault"><span data-t="m_assault"></span></label>
        <label><input type="radio" name="d-measure" value="property"><span data-t="m_property"></span></label>
      </div>
    </div>

    <div class="panel" id="p-areas">
      <div class="dash-grid">
        <div>
          <p class="label" id="rank-l"></p>
          <ol class="rank" id="rank" style="list-style:none;margin:0;padding:0"></ol>
          <p class="note" style="margin-top:10px" data-t="areas_note"></p>
        </div>
        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
    </div>

    <div class="panel" id="p-states" hidden>
      <div class="dash-grid">
        <div>
          <p class="label" id="srank-l"></p>
          <ol class="rank" id="srank" style="list-style:none;margin:0;padding:0"></ol>
          <p class="note" style="margin-top:10px" data-t="states_note"></p>
        </div>
        <div class="detail" id="sdetail" aria-live="polite"></div>
      </div>
    </div>

    <div class="panel" id="p-news" hidden></div>
    <div class="panel" id="p-dosm" hidden></div>

    <div class="sources">
      <p class="label" data-t="sources"></p>
      <p class="note" id="src-list"></p>
    </div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// "Last 2 months" on 11 Nov runs from 11 Sep; a day that doesn't exist (30 Feb) becomes the month's last day.
function deviceRange(v) {
  const now = new Date();
  const to = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
  let from;
  if (v === '2m') {

  } else {
    from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (+v - 1));
  }
  return { from, to };
}

// Place autocomplete, shared by the map's search box and the route's From/To fields.
// District towns come back instantly; the full geocoder answer follows a moment later.
function autocomplete(input, list, onChoose) {
  let results = [], sel = -1, seq = 0, timer = null;
  const show = (rs, msg) => {
    results = rs; sel = rs.length ? 0 : -1;
    list.innerHTML = rs.length
      ? rs.map((r, i) => `<li role="option" id="${list.id}-${i}" aria-selected="${i === 0}" data-i="${i}"><b>${esc(r.label)}</b><span>${esc(apiText(r.sub || ''))}</span></li>`).join('')
      : (msg ? `<li class="msg">${esc(msg)}</li>` : '');
    list.hidden = !list.innerHTML;
    input.setAttribute('aria-expanded', String(!list.hidden));
  };
  const highlight = i => {
    sel = i;
    [...list.querySelectorAll('li[data-i]')].forEach((li, k) => li.setAttribute('aria-selected', String(k === i)));
    input.setAttribute('aria-activedescendant', i >= 0 ? `${list.id}-${i}` : '');
  };
  // Cancels the pending full search too, so it can't reopen the list after a pick.
  const choose = r => { if (!r) return; clearTimeout(timer); seq++; input.value = r.label; show([]); input.blur(); onChoose(r); };
  const run = async (q, local) => {
    const my = ++seq;
    try {
      const r = await api(`/api/search?q=${encodeURIComponent(q)}${local ? '&local=1' : ''}`);
      if (my !== seq || (local && !r.results.length)) return;
      show(r.results, r.error ? apiText(r.error) : (local ? '' : t('no_match', q)));
    } catch { if (my === seq) show([], t('search_down')); }
  };
  input.addEventListener('input', () => {
    const q = input.value.trim();
    input.dispatchEvent(new CustomEvent('typed'));
    clearTimeout(timer);
    if (q.length < 2) { seq++; show([]); return; }
    run(q, true);
    timer = setTimeout(() => run(q, false), 450);
  });
  input.addEventListener('keydown', async e => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); highlight((sel + 1) % results.length); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); highlight((sel - 1 + results.length) % results.length); }
    else if (e.key === 'Escape') show([]);
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (results[sel]) return choose(results[sel]);
      const q = input.value.trim();
      if (q.length >= 2) { clearTimeout(timer); await run(q, false); if (results.length) choose(results[0]); }
    }
  });
  list.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); choose(results[+li.dataset.i]); } });
  input.addEventListener('blur', () => setTimeout(() => show([]), 150));
  return { clear: () => { input.value = ''; show([]); } };
}

  const qs = new URLSearchParams({ from: `${trip.from.lat},${trip.from.lng}`, to: `${trip.to.lat},${trip.to.lng}`, mode: modeVal(),
    since: from.toISOString(), until: to.toISOString() });
  let r;
  try { r = await api(`/api/route?${qs}`); }
  catch { out.innerHTML = `<p class="note">${esc(t('no_server'))}</p>`; return; }
  if (r.error) { out.innerHTML = `<p class="note">${esc(apiText(r.error))}</p>`; return; }
  lastRoute = r;
  drawRoute(r, true);
}

function drawRoute(r, fit) {
  routeLayer.clearLayers();
  const all = r.stretches.flatMap(s => s.coords);
  // A light casing under the coloured stretches keeps the line readable over the red shading.
  L.polyline(all, { color: css('--bg'), weight: 10, opacity: 0.95, interactive: false }).addTo(routeLayer);
  for (const s of r.stretches) {
    L.polyline(s.coords, { color: routeColor(s.level), weight: 6, opacity: 0.95 })
      .bindTooltip(`${esc(t('density_tip', levelName(s.level)))}${s.roads.length ? ` · ${esc(s.roads.join(', '))}` : ''}`, { sticky: true })
      .addTo(routeLayer);
  }
  const pin = (p, label) => L.marker(p, { icon: L.divIcon({ className: 'pin pin-end', html: '', iconSize: [14, 14], iconAnchor: [7, 7] }) }).bindTooltip(label).addTo(routeLayer);
  pin(all[0], `${t('from_pin')}: ${trip.from?.label || ''}`); pin(all[all.length - 1], `${t('to_pin')}: ${trip.to?.label || ''}`);
  for (const w of r.warnings) {
    L.marker([w.lat, w.lng], { icon: L.divIcon({ className: 'pin pin-warn', html: '', iconSize: [20, 20], iconAnchor: [10, 10] }) })
      .bindPopup(`<b>${esc(nice(w.type))}</b> ${t('near')} ${esc(w.road || t('the_route'))}${w.source === 'social' ? ` <span class="tag unverified">${t('unverified')}</span>` : ''}<br>${esc(w.title)}<br><small>${t('m_from_route', w.distanceM)} · ${ago(w.publishedAt)} · ${esc(w.outlet)}</small><br><a href="${esc(w.link)}" target="_blank" rel="noopener">${t('open_source')}</a>`)
      .addTo(routeLayer);
  }
  if (fit) map.fitBounds(L.latLngBounds(all), { padding: [30, 30] });

  const total = r.kmByLevel.reduce((s, l) => s + l.km, 0) || 1;
  const high = r.kmByLevel.filter(l => l.level >= 3).reduce((s, l) => s + l.km, 0);
  const strip = r.kmByLevel.filter(l => l.km > 0).map(l => `<i style="width:${(100 * l.km / total).toFixed(1)}%;background:${routeColor(l.level)}" title="${esc(levelName(l.level))}: ${fmtKm(l.km)}"></i>`).join('');
  const { from, to } = deviceRange(rangeVal());
  $('r-out').innerHTML = `
    <div class="route-sum">${fmtKm(r.distanceKm)} · ${fmtMin(r.durationMin)} <span>${esc(trip.from?.label || '')} → ${esc(trip.to?.label || '')}</span></div>
    <div><div class="strip" role="img" aria-label="${esc(t('strip_aria'))}">${strip}</div>
      <p class="note">${esc(high >= 0.1 ? t('route_high', fmtKm(high), r.highRoads.join(', ')) : t('route_none'))}</p></div>
    <div>
      <p class="label">${esc(t('along'))}</p>
      ${r.warnings.length ? `<ul class="warns">${r.warnings.slice(0, 30).map((w, i) => `
        <li class="${w.source}" data-w="${i}"><div><span class="road">${esc(w.road || t('unnamed'))}</span>: ${esc(nice(w.type))}${w.source === 'social' ? `<span class="tag unverified">${t('unverified')}</span>` : ''}</div>
        <div class="m">${esc(w.title)}</div><div class="m">${t('m_from_route', w.distanceM)} · ${ago(w.publishedAt)} · ${esc(w.outlet)}</div></li>`).join('')}</ul>`
      : `<p class="note">${esc(t('no_reports_route', r.nearM, fmtDay(from), fmtDay(to)))}</p>`}
      ${r.townLevelNear ? `<p class="note">${esc(t('town_near', r.townLevelNear))}</p>` : ''}
    </div>
    <p class="note">${esc(t('route_note', r.nearM))}</p>`;
  $('r-out').querySelectorAll('li[data-w]').forEach(li => li.addEventListener('click', () => {
    const w = r.warnings[+li.dataset.w]; map.setView([w.lat, w.lng], Math.max(map.getZoom(), 15));
  }));
  $('r-clear').hidden = false;
}

// Paints the density grid into a small canvas and stretches it over the area; the browser's
// smoothing turns the 0.5 km cells into a continuous gradient.
function drawHeat() {
  heatLayer?.remove(); heatLayer = null;
  const on = $('f-heat').checked && heatData;
  on ? mapLegend.addTo(map) : mapLegend.remove();
  mapLegend.update();
  $('area').hidden = !heatData;
  if (!heatData) { $('legend').innerHTML = `<span>${esc(t('heat_unavail'))}</span>`; return; }

  const stops = [1, 2, 3, 4].map(i => {
    const c = css(`--heat-${i}`);
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  });
  // Moderate stays a light wash so the eye goes to the high areas.
  const alphas = [0.16, 0.32, 0.50, 0.66];
  const n = heatData.size;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = n;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(n, n);
  heatData.levels.forEach((lvl, k) => {
    let rgb, a;
    if (lvl < 1) { rgb = stops[0]; a = lvl < 0.6 ? 0 : alphas[0] * (lvl - 0.6) / 0.4; }   // fade in below the median
    else {
      const i = Math.min(3, Math.floor(lvl) - 1), f = Math.min(1, lvl - (i + 1)), j = Math.min(3, i + 1);
      rgb = stops[i].map((v, c) => Math.round(v + (stops[j][c] - v) * f));
      a = alphas[i] + (alphas[j] - alphas[i]) * f;
    }
    // Fade out over the outer 15% of the grid so the overlay has no hard square edge.
    const row = Math.floor(k / n), col = k % n;
    const edge = Math.min(1, Math.min(row, col, n - 1 - row, n - 1 - col) / (n * 0.15));
    img.data.set([...rgb, Math.round(a * edge * 255)], k * 4);
  });
  ctx.putImageData(img, 0, 0);
  if (on) heatLayer = L.imageOverlay(canvas.toDataURL(), heatData.bounds, { pane: 'heat', opacity: 1, interactive: false }).addTo(map);

  const h = heatData.here;
  $('area-sw').style.background = h.level < 1 ? 'transparent' : heatColor(h.level);
  $('area-l').textContent = levelName(h.level);
  const shares = [75, 50, 25, 10];
  $('legend').innerHTML = heatData.legend.slice().reverse().map(l =>
    `<div><i style="background:${css(`--heat-${l.level}`)}"></i><span><b>${esc(levelName(l.level))}</b>: ${esc(t('level_note', shares[l.level - 1]))} (${esc(t('per_km2', num(l.minCasesPerKm2)))})</span></div>`).join('') +
    `<div><i style="border:1px solid var(--line)"></i><span><b>${esc(levelName(0))}</b>: ${esc(t('no_shading'))}</span></div>`;
}

function render() {
  drawHeat();
  Object.values(layers).forEach(l => l.clearLayers());
  markerFor.clear();
  const show = { official: $('f-official').checked, news: $('f-news').checked, social: $('f-social').checked };
  Object.entries(show).forEach(([k, on]) => on ? map.addLayer(layers[k]) : map.removeLayer(layers[k]));

  // With no police district HQ inside a small circle, show the district the point is in rather than 0.
  const inside = data.districts.filter(d => d.distanceKm <= radiusKm);
  const own = data.districts[0];
  $('s-official').textContent = inside.length ? num(inside.reduce((s, d) => s + d.total, 0)) : own ? num(own.total) : '0';
  $('s-official-l').textContent = !inside.length && own ? t('official_ipd', data.year || '', own.district) : t('official_cases', data.year || '').trim();

  // Official: one ring per district HQ, sized by annual total.
  const max = Math.max(1, ...data.districts.map(d => d.total));
  $('districts').innerHTML = data.districts.map(d => {
    const top = Object.entries(d.byType).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => `${nice(k)} ${num(n)}`).join(' · ');
    const m = L.circleMarker([d.lat, d.lng], { radius: 10 + 22 * Math.sqrt(d.total / max), color: css('--official'), weight: 1.5, opacity: .7, fillColor: css('--bg'), fillOpacity: $('f-heat').checked ? .08 : .3 })
      .bindPopup(`<b>IPD ${esc(d.district)}</b>, ${esc(d.state)}<br>${t('cases_line', d.year, num(d.total), num(d.assault), num(d.property))}<br>${t('top')}: ${esc(top)}<br><small>${t(d.located === 'table' ? 'loc_table' : 'loc_geo')}</small>`);
    layers.official.addLayer(m);
    markerFor.set(`d:${d.district}`, m);
    return `<li class="official" data-key="d:${esc(d.district)}"><div class="t">IPD ${esc(d.district)}</div><div class="m">${esc(t('district_row', d.distanceKm, num(d.total), d.year))}${d.distanceKm > radiusKm ? esc(t('outside', radiusKm)) : ''}</div></li>`;
  }).join('') || `<li class="empty">${esc(t('no_district'))}</li>`;

  // News and social: individual pins.

  $('s-news').textContent = data.incidents.filter(i => i.source === 'news').length;
  $('s-social').textContent = data.incidents.filter(i => i.source === 'social').length;
  for (const i of visible) {
    const social = i.source === 'social';
    const approx = i.precision === 'town';
    const more = (i.alsoReported || []).map(r => `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.outlet)}</a>`).join(', ');
    // Square pins: filled for news, dashed for unverified social posts. Town-level pins (placed only by the
    // article's dateline) are larger and hollow, to read as approximate.
    const size = approx ? 16 : 10;
    const m = L.marker([i.lat, i.lng], {
      icon: L.divIcon({ className: `pin ${approx ? 'pin-town' : social ? 'pin-social' : 'pin-news'}`, html: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2] }),
      keyboard: false,
    }).bindPopup(`<b>${esc(nice(i.type))}</b>${social ? ` <span class="tag unverified">${t('unverified')}</span>` : ''}${approx ? ` <span class="tag approx">${t('town_level')}</span>` : ''}<br>${esc(i.title)}<br><small>${esc(i.area)} · ${ago(i.publishedAt)} · ${esc(i.outlet)}</small>${approx ? `<br><small>${esc(t('town_note'))}</small>` : ''}<br><a href="${esc(i.link)}" target="_blank" rel="noopener">${t('open_source')}</a>${more ? `<br><small>${t('also_by')} ${more}</small>` : ''}`);
    layers[i.source].addLayer(m);
    markerFor.set(`i:${i.link}`, m);
  }
  $('list').innerHTML = visible.length ? visible.slice(0, 40).map(i => `
    <li class="${i.source}" data-key="i:${esc(i.link)}">
      <div class="t">${esc(nice(i.type))}${i.source === 'social' ? `<span class="tag unverified">${t('unverified')}</span>` : ''}${i.precision === 'town' ? `<span class="tag approx">${t('town_level')}</span>` : ''}</div>
      <div class="m">${esc(i.area)} · ${i.distanceKm} km · ${ago(i.publishedAt)}</div>
      <div class="m src">${t(i.source === 'social' ? 'lbl_social' : 'lbl_news')} · ${esc(i.outlet)}${i.alsoReported?.length ? ` ${t('more', i.alsoReported.length)}` : ''}</div>
    </li>`).join('') : `<li class="empty">${esc(t('no_reports_area'))}</li>`;
}

// Device location. Asks for the precise (GPS) fix and never reuses an old one. The first fix is often rough
// (from Wi-Fi or cell towers), so it keeps listening for up to 20 seconds and moves to each better fix,
// stopping early once it's within 30 m. The circle and the label show how accurate the fix is.
let watchId = null, watchTimer = null, accCircle = null;
function stopWatch() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  clearTimeout(watchTimer); watchId = null;
  if (/…$/.test($('where').textContent)) showWhere();
}
const fmtAcc = m => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toLocaleString(locale(), { maximumFractionDigits: 1 })} km`;
function locate() {
  if (!navigator.geolocation) return setPoint(...KL, () => t('loc_unavail'));
  stopWatch();
  whereText = () => t('locating'); showWhere();
  let best = null;
  const label = acc => () => `${t('around_loc', fmtAcc(acc))}${acc > 1000 ? ` ${t('loc_rough')}` : ''}${watchId !== null && acc > 30 ? ` ${t('loc_improving')}` : ''}`;
  watchId = navigator.geolocation.watchPosition(p => {
    const fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    if (best && fix.acc >= best.acc * 0.8) return;            // only clearly better fixes
    const moved = best ? kmBetween(best, fix) : Infinity;
    best = fix;
    if (fix.acc <= 30) { navigator.geolocation.clearWatch(watchId); clearTimeout(watchTimer); watchId = null; }
    // Reload the area only when the point has really moved; otherwise just tighten the circle and label.
    if (moved > 0.3) setPoint(fix.lat, fix.lng, label(fix.acc), fix);
    else { here = { lat: fix.lat, lng: fix.lng }; me?.setLatLng([fix.lat, fix.lng]); ring?.setLatLng([fix.lat, fix.lng]); accCircle?.setLatLng([fix.lat, fix.lng]).setRadius(fix.acc); whereText = label(fix.acc); showWhere(); }
  }, err => {
    // Phones often report a brief "position unavailable" between GPS readings: keep listening unless
    // location was refused. The 20-second timer ends the wait either way.
    if (err.code !== 1) return;
    stopWatch();
    if (!best) setPoint(...KL, () => t('loc_denied'));
  }, { enableHighAccuracy: true, maximumAge: 0 });
  watchTimer = setTimeout(() => {
    if (watchId === null) return;
    navigator.geolocation.clearWatch(watchId); watchId = null;
    best ? showWhere() : setPoint(...KL, () => t('loc_unavail'));
  }, 20000);
}

// ---------- Dashboard ----------
// Four sections: the top 10 police districts, states, the news and social reports, and DOSM's 2026 release.
const dash = { open: null, all: null, year: null, sel: null, home: null, state: null, dosm: null, incidents: [], reportsFor: null, seq: 0 };
const dKey = d => `${d.state}|${d.district}`;
const radio = n => document.querySelector(`input[name="${n}"]:checked`).value;
const kmBetween = (a, b) => {
  const x = (b.lng - a.lng) * Math.cos((a.lat + b.lat) * Math.PI / 360), y = b.lat - a.lat;
  return Math.sqrt(x * x + y * y) * 111.2;
};
const nearestDistrict = p => dash.all.reduce((best, d) => kmBetween(p, d) < kmBetween(p, best) ? d : best);
// "▲ 12%" / "▼ 5%" against the year before; rises in the accent colour.
function change(now, before, prevYear) {
  if (!before) return '';
  const p = Math.round(100 * (now - before) / before);
  const yr = prevYear ? ` ${t('vs', prevYear)}` : '';
  if (p === 0) return `<span class="down">${esc(t('no_change'))}${yr}</span>`;
  return `<span class="${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%${yr}</span>`;
}
// A row with a refId opens its news reports underneath when clicked, and closes them on a second click.
const barRows = (rows, max, cls = '') => `<ul class="bars ${cls}">${rows.map(([k, n, extra, ref, items], i) => {
  const open = ref && dash.open === ref;
  const inner = `<span class="k"><em>${i + 1}</em>${k}${ref ? `<span class="arr" aria-hidden="true">${open ? '▴' : '▾'}</span>` : ''}</span><span class="c">${num(n)}${extra ? `<small>${extra}</small>` : ''}</span>
    <span class="bar"><i style="width:${(100 * n / Math.max(1, max)).toFixed(1)}%"></i></span>`;
  return `<li>${ref ? `<button type="button" class="row" data-ref="${esc(ref)}" aria-expanded="${open}">${inner}</button>${open ? refsList(items) : ''}` : `<div class="row">${inner}</div>`}</li>`;
}).join('')}</ul>`;
// The news and social reports behind a row, newest first.
function refsList(items) {
  if (!items?.length) return `<div class="refs"><p class="note">${esc(t('refs_none'))}</p></div>`;
  const shown = items.slice(0, 10);
  return `<div class="refs"><ol>${shown.map(i => `<li>
      <a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      <div class="m">${esc(nice(i.type))} · ${esc(i.area || i.district)} · ${ago(i.publishedAt)} · ${esc(i.outlet)}${i.source === 'social' ? ` · ${esc(t('unverified'))}` : ''}</div></li>`).join('')}</ol>
    ${items.length > shown.length ? `<p class="note">${esc(t('refs_more', items.length - shown.length))}</p>` : ''}</div>`;
}
const newsCount = items => `${esc(t('n_reports_tog', items.length))}`;
const share = (n, total) => n / (total || 1) < .005 ? '<1%' : `${Math.round(100 * n / (total || 1))}%`;

// The two buttons at the top of the panel work as a pair: the one in use is highlighted.
function markActive(dashOpen) {

async function openDash() {

  const home = nearestDistrict(here || { lat: KL[0], lng: KL[1] });
  dash.sel = dash.home = dKey(home);
  dash.state ||= home.state;
  renderDash();
}
function dashCall() {
  const { from, to } = deviceRange(rangeVal());
  return api(`/api/dashboard?from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(to.toISOString())}`);
}
// Each report is counted in its nearest police district (and that district's state).
function setReports(r) {
  dash.reportsFor = rangeVal();
  dash.incidents = (r.incidents || []).map(i => {
    const d = nearestDistrict(i);
    return { ...i, district: d.district, state: d.state, dkey: dKey(d) };
  });
  const by = new Map();
  for (const i of dash.incidents) by.set(i.dkey, (by.get(i.dkey) || 0) + 1);
  for (const d of dash.all) d.news = by.get(dKey(d)) || 0;
}
async function loadDashReports() {
  const my = ++dash.seq;
  try { const r = await dashCall(); if (my === dash.seq && dash.all) { setReports(r); renderDash(); } } catch {}
}
function closeDash(focusOn = 'dash-open') {
  if ($('dash').hidden) return;
  $('dash').hidden = true;
  markActive(false);
  $(focusOn)?.focus();
}

function renderDash() {
  if (!dash.all) return;
  const tab = radio('d-tab');
  ['areas', 'states', 'news', 'dosm'].forEach(p => { $(`p-${p}`).hidden = p !== tab; });
  $('d-ctl').hidden = tab === 'news' || tab === 'dosm';
  $('d-scope-seg').hidden = tab !== 'areas';
  $('dash-k').textContent = tab === 'dosm' && dash.dosm ? t('dosm_k', fmtDay(dash.dosm.released))
    : tab === 'news' || radio('d-measure') === 'news' ? t('news_k', rangeName()) : t('official_k', dash.year);
  if (tab === 'areas') renderAreas();
  if (tab === 'states') renderStates();
  if (tab === 'news') renderNews();
  if (tab === 'dosm') renderDosm();
  const d = dash.dosm;
  $('src-list').innerHTML = [t('src_pdrm', dash.year),
    d ? `${esc(t('src_dosm', fmtDay(d.released), d.year))} <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(t('dosm_links'))}</a> · <a href="${esc(d.pdf)}" target="_blank" rel="noopener">${esc(t('dosm_pdf'))}</a>` : '',
    t('src_news')].filter(Boolean).map((s, i) => i === 1 ? s : esc(s)).join('<br>');
}

// --- Top 10 areas ---
function renderAreas() {
  const all = dash.all, m = radio('d-measure'), scope = radio('d-scope');
  const sel = all.find(d => dKey(d) === dash.sel) || all[0];
  $('d-state').textContent = sel.state;
  const news = m === 'news';
  // Ranked by news reports, areas without any are left out (the selected one still shows below).
  const pool = (scope === 'state' ? all.filter(d => d.state === sel.state) : all).filter(d => !news || d.news > 0 || dKey(d) === dash.sel);
  const sorted = [...pool].sort((a, b) => b[m] - a[m]);
  const top = sorted.slice(0, 10);
  const max = Math.max(1, top[0]?.[m] || 0);
  const where = scope === 'state' ? sel.state : 'Malaysia';
  const allNews = dash.incidents.length;
  $('rank-l').textContent = t('top10_l', t('measures')[m], where, news ? rangeName() : dash.year);
  const row = (d, n) => {
    const ref = `a:${dKey(d)}`, open = dash.open === ref, items = nearReports(d);
    return `<li><button type="button" data-k="${esc(dKey(d))}" data-ref="${esc(ref)}" aria-pressed="${dKey(d) === dash.sel}" aria-expanded="${open}">
      <span class="n">${n}</span>
      <span class="nm">IPD ${esc(d.district)}<small>${esc(d.state)}${dKey(d) === dash.home ? ` · ${esc(t('your_area'))}` : ''} · ${news ? esc(`${num(d.total)} ${t('police_cases', dash.year)}`) : newsCount(items)} <span aria-hidden="true">${open ? '▴' : '▾'}</span></small></span>
      <span class="v">${num(d[m])}<small>${news ? share(d.news, allNews) : change(d[m], d.prev?.[m])}</small></span>
      <span class="bar"><i style="width:${(100 * d[m] / max).toFixed(1)}%"></i></span></button>${open ? refsList(items) : ''}</li>`;
  };
  let html = top.map((d, i) => row(d, i + 1)).join('');
  // The selected area, if it isn't in the top 10, is shown below with its own rank.
  const at = sorted.findIndex(d => dKey(d) === dash.sel);
  if (at >= 10) html += `<li class="empty" style="padding:8px 0 4px;border-bottom:0;font-size:12.5px">${esc(t('ranked_of', at + 1, sorted.length, where))}</li>` + row(sorted[at], at + 1);
  $('rank').innerHTML = html;
  renderAreaDetail(sel);
}

function typeBars(byType, total) {
  const types = Object.entries(byType).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 10);
  return { types, html: types.length ? barRows(types.map(([k, n]) => [esc(nice(k)), n, share(n, total)]), types[0][1]) : `<p class="note">${esc(t('no_cases'))}</p>` };
}
const nearReports = d => dash.incidents.filter(i => i.dkey === dKey(d));
// News bars by crime type; refPrefix makes each type open its own reports.
function reportBars(items, emptyKey, refPrefix) {
  const by = new Map();
  for (const i of items) { if (!by.has(i.type)) by.set(i.type, []); by.get(i.type).push(i); }
  const rows = [...by.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 10);
  return rows.length ? barRows(rows.map(([k, list]) => [esc(nice(k)), list.length, '', `${refPrefix}:${k}`, list]), rows[0][1].length, 'ink') : `<p class="note">${esc(t(emptyKey))}</p>`;
}

function renderAreaDetail(d) {
  const all = dash.all, year = dash.year;
  const natRank = [...all].sort((a, b) => b.total - a.total).findIndex(x => dKey(x) === dKey(d)) + 1;
  const withNews = [...all].filter(x => x.news > 0).sort((a, b) => b.news - a.news);
  const newsRank = withNews.findIndex(x => dKey(x) === dKey(d)) + 1;
  const { types, html } = typeBars(d.byType, d.total);
  const stat = (n, label, before) => `<div class="stat"><b>${num(n)}</b><span>${esc(label)}</span><span>${change(n, before) || '&nbsp;'}</span></div>`;
  const plain = (n, label) => `<div class="stat"><b>${num(n)}</b><span>${esc(label)}</span></div>`;
  const { from, to } = deviceRange(rangeVal());
  const near = nearReports(d);
  const nNews = near.filter(i => i.source === 'news').length;
  $('detail').innerHTML = `
    <div>
      <p class="kicker">${esc(t(dKey(d) === dash.home ? 'your_area_k' : 'selected'))} · ${esc(rangeName())}</p>
      <h3>IPD ${esc(d.district)}</h3>
      <p class="sub">${esc(d.state)}${newsRank ? ` · ${esc(t('news_rank_area', newsRank, withNews.length))}` : ''}</p>
    </div>
    <div class="stats">${plain(nNews, t('news_reports'))}${plain(near.length - nNews, t('social_posts'))}<div class="stat old"><b>${num(d.total)}</b><span>${esc(t('police_cases', year))}</span></div></div>
    <div>
      <p class="label">${esc(t('top_news', rangeName()))}</p>
      ${reportBars(near, 'no_news_here', `at:${dKey(d)}`)}
      <p class="note" style="margin-top:8px">${esc(t('near_note', fmtDay(from), fmtDay(to)))}</p>
    </div>
    <div class="police">
      <p class="label">${esc(t('police_k', year))}</p>
      <p class="sub" style="margin:0 0 10px">${esc(t('nat_rank', natRank, all.length))}</p>
      <div class="stats">${stat(d.total, t('all_cases'), d.prev?.total)}${stat(d.assault, t('violent'), d.prev?.assault)}${stat(d.property, t('property'), d.prev?.property)}</div>
      <p class="label" style="margin-top:14px">${esc(t('top_crimes', types.length, year))}</p>
      ${html}
      <p class="note" style="margin-top:8px">${esc(t('police_note', year))}</p>
    </div>
    <button class="primary" type="button" id="d-map">${esc(t('show_map'))}</button>`;
  $('d-map').addEventListener('click', () => { closeDash(); setPoint(d.lat, d.lng, () => t('around', `IPD ${d.district}, ${d.state}`)); });
}

// --- States ---
function stateTotals() {
  const by = new Map();
  for (const d of dash.all) {
    if (!by.has(d.state)) by.set(d.state, { state: d.state, districts: 0, news: 0, total: 0, assault: 0, property: 0, byType: {}, prev: { total: 0, assault: 0, property: 0 }, hasPrev: true });
    const s = by.get(d.state);
    s.districts++;
    s.news += d.news || 0;
    for (const k of ['total', 'assault', 'property']) { s[k] += d[k]; s.prev[k] += d.prev?.[k] || 0; }
    if (!d.prev) s.hasPrev = false;
    for (const [k, n] of Object.entries(d.byType)) s.byType[k] = (s.byType[k] || 0) + n;
  }
  return [...by.values()].map(s => ({ ...s, prev: s.hasPrev ? s.prev : null }));
}
function renderStates() {
  const m = radio('d-measure');
  const states = stateTotals();
  const sorted = [...states].sort((a, b) => b[m] - a[m]);
  if (!states.some(s => s.state === dash.state)) dash.state = sorted[0].state;
  const max = Math.max(1, sorted[0]?.[m] || 0);
  const homeState = dash.all.find(d => dKey(d) === dash.home)?.state;
  const news = m === 'news', allNews = dash.incidents.length;
  $('srank-l').textContent = t('states_l', t('measures')[m], news ? rangeName() : dash.year);
  $('srank').innerHTML = sorted.map((s, i) => {
    const ref = `s:${s.state}`, open = dash.open === ref, items = dash.incidents.filter(x => x.state === s.state);
    return `<li><button type="button" data-s="${esc(s.state)}" data-ref="${esc(ref)}" aria-pressed="${s.state === dash.state}" aria-expanded="${open}">
      <span class="n">${i + 1}</span>
      <span class="nm">${esc(s.state)}<small>${s.state === homeState ? `${esc(t('your_area'))} · ` : ''}${news ? esc(`${num(s.total)} ${t('police_cases', dash.year)}`) : newsCount(items)} <span aria-hidden="true">${open ? '▴' : '▾'}</span></small></span>
      <span class="v">${num(s[m])}<small>${news ? share(s.news, allNews) : change(s[m], s.prev?.[m])}</small></span>
      <span class="bar"><i style="width:${(100 * s[m] / max).toFixed(1)}%"></i></span></button>${open ? refsList(items) : ''}</li>`;
  }).join('');
  renderStateDetail(states.find(s => s.state === dash.state), states);
}
function renderStateDetail(s, states) {
  const year = dash.year;
  const rank = [...states].sort((a, b) => b.total - a.total).findIndex(x => x.state === s.state) + 1;
  const { types, html } = typeBars(s.byType, s.total);
  const stat = (n, label, before) => `<div class="stat"><b>${num(n)}</b><span>${esc(label)}</span><span>${change(n, before) || '&nbsp;'}</span></div>`;
  const dosm = dash.dosm?.onlineFraudByState;
  const fNow = dosm?.[dash.dosm.year]?.[s.state], fPrev = dosm?.[dash.dosm.prevYear]?.[s.state];
  const reports = dash.incidents.filter(i => i.state === s.state);
  const nNews = reports.filter(i => i.source === 'news').length;
  const newsRank = [...states].filter(x => x.news > 0).sort((a, b) => b.news - a.news).findIndex(x => x.state === s.state) + 1;
  const plain = (n, label) => `<div class="stat"><b>${num(n)}</b><span>${esc(label)}</span></div>`;
  $('sdetail').innerHTML = `
    <div>
      <p class="kicker">${esc(t('state_k'))} · ${esc(rangeName())}</p>
      <h3>${esc(s.state)}</h3>
      <p class="sub">${newsRank ? `${esc(t('news_rank_state', newsRank, states.filter(x => x.news > 0).length))} · ` : ''}${esc(t('districts_n', s.districts))}</p>
    </div>
    <div class="stats">${plain(nNews, t('news_reports'))}${plain(reports.length - nNews, t('social_posts'))}<div class="stat old"><b>${num(s.total)}</b><span>${esc(t('police_cases', year))}</span></div></div>
    <div>
      <p class="label">${esc(t('top_news', rangeName()))}</p>
      ${reportBars(reports, 'no_news_state', `st:${s.state}`)}
      <p class="note" style="margin-top:8px">${esc(t('state_news_note'))}</p>
    </div>
    <div class="police">
      <p class="label">${esc(t('police_k', year))}</p>
      <p class="sub" style="margin:0 0 10px">${esc(t('state_rank', rank, states.length))}</p>
      <div class="stats">${stat(s.total, t('all_cases'), s.prev?.total)}${stat(s.assault, t('violent'), s.prev?.assault)}${stat(s.property, t('property'), s.prev?.property)}</div>
      <p class="label" style="margin-top:14px">${esc(t('top_crimes', types.length, year))}</p>
      ${html}
      <p class="note" style="margin-top:8px">${esc(t('police_note', year))}</p>
    </div>
    ${dash.dosm ? `<div>
      <p class="label">${esc(t('fraud_l', dash.dosm.year))}</p>
      ${fNow != null ? `<div class="stats" style="grid-template-columns:1fr"><div class="stat"><b>${num(fNow)}</b><span>${change(fNow, fPrev, dash.dosm.prevYear) || '&nbsp;'}</span></div></div>`
        : `<p class="note">${esc(t('fraud_none'))}</p>`}
    </div>` : ''}
    <button class="primary" type="button" id="s-areas">${esc(t('see_areas', s.state))}</button>`;
  $('s-areas').addEventListener('click', () => {
    const m = radio('d-measure');
    const top = dash.all.filter(d => d.state === s.state).sort((a, b) => b[m] - a[m])[0];
    dash.sel = dKey(top);
    document.querySelector('input[name="d-scope"][value="state"]').checked = true;
    document.querySelector('input[name="d-tab"][value="areas"]').checked = true;
    renderDash();
  });
}

// --- News reports ---
function renderNews() {
  const items = dash.incidents;
  const { from, to } = deviceRange(rangeVal());
  // Top 10 by a field, each with the reports behind it.
  const count = key => {
    const c = new Map();
    for (const i of items) { if (!c.has(i[key])) c.set(i[key], []); c.get(i[key]).push(i); }
    return [...c.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 10);
  };
  const nNews = items.filter(i => i.source === 'news').length;
  if (!items.length) { $('p-news').innerHTML = `<h3 style="font:800 22px/1.1 var(--sans);margin:0">${esc(t('news_h'))}</h3><p class="note">${esc(t('n_none'))}</p><p class="note">${esc(t('n_note', fmtDay(from), fmtDay(to)))}</p>`; return; }
  const types = count('type'), states = count('state');
  const areas = count('dkey').map(([k, list]) => [esc(t('n_area_row', k.split('|')[1])) + `<small style="margin-left:6px;color:var(--muted);font:600 10px/1 var(--narrow);letter-spacing:.06em">${esc(k.split('|')[0])}</small>`, list.length, '', `na:${k}`, list]);
  $('p-news').innerHTML = `
    <h3 style="font:800 22px/1.1 var(--sans);letter-spacing:-.02em;margin:0">${esc(t('news_h'))}</h3>
    <div class="stats">
      <div class="stat"><b>${num(items.length)}</b><span>${esc(t('n_total'))}</span></div>
      <div class="stat"><b>${num(nNews)}</b><span>${esc(t('n_news'))}</span></div>
      <div class="stat"><b>${num(items.length - nNews)}</b><span>${esc(t('n_social'))}</span></div>
    </div>
    <div class="cols">
      <div><p class="label">${esc(t('n_types'))}</p>${barRows(types.map(([k, list]) => [esc(nice(k)), list.length, share(list.length, items.length), `nt:${k}`, list]), types[0][1].length)}</div>
      <div><p class="label">${esc(t('n_states'))}</p>${barRows(states.map(([k, list]) => [esc(k), list.length, share(list.length, items.length), `ns:${k}`, list]), states[0][1].length, 'ink')}</div>
      <div><p class="label">${esc(t('n_areas'))}</p>${barRows(areas, areas[0][1], 'ink')}</div>
      <div><p class="label">${esc(t('n_latest'))}</p><ul class="latest">${items.slice(0, 10).map(i => `<li>
          <a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>
          <div class="m" style="color:var(--muted);font:600 10.5px/1.4 var(--narrow);letter-spacing:.06em;text-transform:uppercase;margin-top:3px">${esc(nice(i.type))} · ${esc(i.area || i.district)} · ${ago(i.publishedAt)} · ${esc(i.outlet)}${i.source === 'social' ? ` · ${esc(t('unverified'))}` : ''}</div></li>`).join('')}</ul></div>
    </div>
    <p class="note">${esc(t('n_note', fmtDay(from), fmtDay(to)))}</p>`;
}

// --- DOSM 2026 release ---
function renderDosm() {
  const d = dash.dosm;
  if (!d) { $('p-dosm').innerHTML = `<p class="note">${esc(t('dosm_missing'))}</p>`; return; }
  const val = h => h.unit === 'rm_million' ? t('rm_million', num(h.now)) : num(h.now);
  const prev = h => h.unit === 'rm_million' ? t('rm_million', num(h.prev)) : num(h.prev);
  const fNow = d.onlineFraudByState[d.year], fPrev = d.onlineFraudByState[d.prevYear];
  const rows = Object.entries(fNow).sort((a, b) => b[1] - a[1]);
  $('p-dosm').innerHTML = `
    <div>
      <h3 style="font:800 22px/1.1 var(--sans);letter-spacing:-.02em;margin:0">${esc(t('dosm_h'))}</h3>
      <p class="sub">${esc(t('dosm_sub', d.year, d.prevYear))}</p>
    </div>
    <div class="cards">${d.headline.map(h => `<div class="card">
        <p class="label">${esc(t('dosm_labels')[h.key] || h.key)}</p>
        <b>${esc(val(h))}</b>
        <small>${change(h.now, h.prev)} · ${esc(t('dosm_prev', d.prevYear, prev(h)))}</small></div>`).join('')}</div>
    <div>
      <p class="label">${esc(t('dosm_fraud_l', d.year))}</p>
      ${barRows(rows.map(([s, n]) => [esc(s), n, change(n, fPrev[s])]), rows[0][1])}
    </div>
    <p class="note">${esc(t('dosm_note'))}</p>`;
}

// Clicking the dashboard button again closes it.
$('dash-open').addEventListener('click', () => $('dash').hidden ? openDash() : closeDash());
$('dash-close').addEventListener('click', () => closeDash());
// Clicking a ranking row opens its news reports; clicking it again closes them. Area and state rows
// also select that area or state for the details beside the list.
$('dash').addEventListener('click', e => {
  const b = e.target.closest('button[data-ref]');
  if (!b) return;
  const ref = b.dataset.ref;
  dash.open = dash.open === ref ? null : ref;
  if (b.dataset.k) dash.sel = b.dataset.k;
  if (b.dataset.s) dash.state = b.dataset.s;
  renderDash();
  $('dash').querySelector(`button[data-ref="${CSS.escape(ref)}"]`)?.focus();
});
document.querySelectorAll('input[name="d-scope"], input[name="d-measure"], input[name="d-tab"]').forEach(el => el.addEventListener('change', renderDash));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('dash').hidden) closeDash(); });

// ---------- Switching language ----------
document.querySelectorAll('input[name="lang"]').forEach(el => el.addEventListener('change', () => {
  lang = el.value;
  try { localStorage.setItem('lang', lang); } catch {}
  applyStatic();
  showTitle();
  showWhere();
  if (here) { showRange(); render(); }
  if (lastRoute && !$('r-out').hidden) drawRoute(lastRoute, false);
  if (!$('dash').hidden) renderDash();
}));

showTitle();
locate();
</script>
</body>
</html>
